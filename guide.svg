<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1200" width="100%" height="100%" style="background:#0a0b10; font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Roboto',sans-serif;">
  <defs>
    <!-- Градиенты и тени -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131a"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#00e5ff"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#ff9f0a"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#30d158"/>
    </marker>
  </defs>

  <!-- ФОН И ЗАГОЛОВОК -->
  <rect width="1000" height="1200" fill="url(#bgGrad)"/>
  <text x="500" y="55" fill="#ffffff" font-size="28" font-weight="700" text-anchor="middle" letter-spacing="1">ШПАРГАЛКА ИЛЛЮЗИОНИСТА: ТОКСИЧНЫЙ КАЛЬКУЛЯТОР</text>
  <text x="500" y="85" fill="#8e8e93" font-size="15" text-anchor="middle">Точная карта секретных зон и алгоритм выступления</text>

  <!-- ================= СМАРТФОН ================= -->
  <!-- Корпус телефона -->
  <rect x="320" y="120" width="360" height="740" rx="44" fill="#000000" stroke="#2c2c2e" stroke-width="6"/>
  <rect x="450" y="132" width="100" height="18" rx="9" fill="#1c1c1e"/> <!-- Dynamic Island -->

  <!-- ЗОНА ДИСПЛЕЯ -->
  <rect x="330" y="160" width="340" height="180" fill="#000000"/>
  <text x="645" y="325" fill="#ffffff" font-size="62" font-weight="300" text-anchor="end" font-family="-apple-system, sans-serif">17 071 755</text>

  <!-- СЕКРЕТНЫЕ ЗОНЫ (Подсвечены пунктиром для фокусника) -->
  <!-- Левый угол (Активация) -->
  <rect x="330" y="160" width="90" height="60" rx="8" fill="rgba(0, 229, 255, 0.15)" stroke="#00e5ff" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="375" cy="190" r="14" fill="#00e5ff" fill-opacity="0.2"/>
  <text x="375" y="196" fill="#00e5ff" font-size="14" font-weight="bold" text-anchor="middle">⚡ 2x</text>

  <!-- Правый угол (Сброс) -->
  <rect x="580" y="160" width="90" height="60" rx="8" fill="rgba(255, 69, 58, 0.15)" stroke="#ff453a" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="625" cy="190" r="14" fill="#ff453a" fill-opacity="0.2"/>
  <text x="625" y="196" fill="#ff453a" font-size="14" font-weight="bold" text-anchor="middle">🔒 3x</text>

  <!-- Зона зажатия и свайпа по дисплею -->
  <rect x="340" y="240" width="320" height="95" rx="12" fill="none" stroke="#30d158" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- КНОПКИ КАЛЬКУЛЯТОРА -->
  <!-- Ряд 1: AC, +/-, %, ÷ -->
  <circle cx="375" cy="390" r="32" fill="#a5a5a5"/>
  <text x="375" y="399" fill="#000" font-size="24" font-weight="500" text-anchor="middle">AC</text>

  <circle cx="458" cy="390" r="32" fill="#a5a5a5"/>
  <text x="458" y="399" fill="#000" font-size="24" font-weight="500" text-anchor="middle">+/-</text>

  <circle cx="542" cy="390" r="32" fill="#a5a5a5"/>
  <text x="542" y="399" fill="#000" font-size="24" font-weight="500" text-anchor="middle">%</text>

  <circle cx="625" cy="390" r="32" fill="#ff9f0a"/>
  <text x="625" y="400" fill="#fff" font-size="30" font-weight="400" text-anchor="middle">÷</text>

  <!-- Ряд 2: 7, 8, 9, × -->
  <circle cx="375" cy="470" r="32" fill="#333333"/>
  <text x="375" y="479" fill="#fff" font-size="26" text-anchor="middle">7</text>

  <circle cx="458" cy="470" r="32" fill="#333333"/>
  <text x="458" y="479" fill="#fff" font-size="26" text-anchor="middle">8</text>

  <circle cx="542" cy="470" r="32" fill="#333333"/>
  <text x="542" y="479" fill="#fff" font-size="26" text-anchor="middle">9</text>

  <circle cx="625" cy="470" r="32" fill="#ff9f0a"/>
  <text x="625" y="480" fill="#fff" font-size="30" font-weight="400" text-anchor="middle">×</text>

  <!-- Ряд 3: 4, 5, 6, − -->
  <circle cx="375" cy="550" r="32" fill="#333333"/>
  <text x="375" y="559" fill="#fff" font-size="26" text-anchor="middle">4</text>

  <circle cx="458" cy="550" r="32" fill="#333333"/>
  <text x="458" y="559" fill="#fff" font-size="26" text-anchor="middle">5</text>

  <circle cx="542" cy="550" r="32" fill="#333333"/>
  <text x="542" y="559" fill="#fff" font-size="26" text-anchor="middle">6</text>

  <circle cx="625" cy="550" r="32" fill="#ff9f0a"/>
  <text x="625" y="560" fill="#fff" font-size="30" font-weight="400" text-anchor="middle">−</text>

  <!-- Ряд 4: 1, 2, 3, + -->
  <circle cx="375" cy="630" r="32" fill="#333333"/>
  <text x="375" y="639" fill="#fff" font-size="26" text-anchor="middle">1</text>

  <circle cx="458" cy="630" r="32" fill="#333333"/>
  <text x="458" y="639" fill="#fff" font-size="26" text-anchor="middle">2</text>

  <circle cx="542" cy="630" r="32" fill="#333333"/>
  <text x="542" y="639" fill="#fff" font-size="26" text-anchor="middle">3</text>

  <!-- Кнопка [+] с подсветкой фокуса -->
  <circle cx="625" cy="630" r="36" fill="none" stroke="#ff9f0a" stroke-width="3" filter="url(#glowOrange)"/>
  <circle cx="625" cy="630" r="32" fill="#ff9f0a"/>
  <text x="625" y="640" fill="#fff" font-size="32" font-weight="400" text-anchor="middle">+</text>

  <!-- Ряд 5: 0, ,, = -->
  <rect x="343" y="678" width="148" height="64" rx="32" fill="#333333"/>
  <text x="375" y="719" fill="#fff" font-size="26" text-anchor="middle">0</text>

  <circle cx="542" cy="710" r="32" fill="#333333"/>
  <text x="542" y="718" fill="#fff" font-size="26" text-anchor="middle">,</text>

  <!-- Кнопка [=] с подсветкой финала -->
  <circle cx="625" cy="710" r="36" fill="none" stroke="#ff9f0a" stroke-width="3" filter="url(#glowOrange)"/>
  <circle cx="625" cy="710" r="32" fill="#ff9f0a"/>
  <text x="625" y="719" fill="#fff" font-size="32" font-weight="400" text-anchor="middle">=</text>

  <!-- ================= СТРЕЛКИ И ВЫНОСКИ (100% ТОЧНОСТЬ) ================= -->

  <!-- Выноска 1: Левый угол (Активация) -->
  <path d="M120,180 L300,180 L360,185" fill="none" stroke="#00e5ff" stroke-width="2.5" marker-end="url(#arrowCyan)"/>
  <rect x="30" y="125" width="230" height="90" rx="12" fill="#151722" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="45" y="155" fill="#00e5ff" font-size="16" font-weight="bold">⚡ 2 БЫСТРЫХ ТАПА</text>
  <text x="45" y="180" fill="#ffffff" font-size="13">Левый верхний угол</text>
  <text x="45" y="200" fill="#8e8e93" font-size="11">Заряд магии перед нажатием [+]</text>

  <!-- Выноска 2: Правый угол (Сброс) -->
  <path d="M880,180 L700,180 L640,185" fill="none" stroke="#ff453a" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <rect x="740" y="125" width="230" height="90" rx="12" fill="#151722" stroke="#ff453a" stroke-width="1.5"/>
  <text x="755" y="155" fill="#ff453a" font-size="16" font-weight="bold">🔒 3 БЫСТРЫХ ТАПА</text>
  <text x="755" y="180" fill="#ffffff" font-size="13">Правый верхний угол</text>
  <text x="755" y="200" fill="#8e8e93" font-size="11">Мгновенный сброс в обычный</text>

  <!-- Выноска 3: Удержание на экране (Смена числа) -->
  <path d="M120,290 L260,290 L345,290" fill="none" stroke="#30d158" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <rect x="30" y="245" width="230" height="90" rx="12" fill="#151722" stroke="#30d158" stroke-width="1.5"/>
  <text x="45" y="275" fill="#30d158" font-size="16" font-weight="bold">⏱️ ЗАЖАТИЕ 2.5 СЕК</text>
  <text x="45" y="300" fill="#ffffff" font-size="13">Прямо по цифрам дисплея</text>
  <text x="45" y="320" fill="#8e8e93" font-size="11">Окно смены секретного числа</text>

  <!-- Выноска 4: Свайп по экрану -->
  <path d="M880,290 L740,290 L650,290" fill="none" stroke="#00e5ff" stroke-width="2" marker-end="url(#arrowCyan)"/>
  <rect x="740" y="245" width="230" height="90" rx="12" fill="#151722" stroke="#00e5ff" stroke-width="1.5"/>
  <text x="755" y="275" fill="#00e5ff" font-size="16" font-weight="bold">↔️ СВАЙП ПО ЭКРАНУ</text>
  <text x="755" y="300" fill="#ffffff" font-size="13">Влево или вправо по цифрам</text>
  <text x="755" y="320" fill="#8e8e93" font-size="11">Стереть последнюю цифру</text>

  <!-- Выноска 5: Кнопка [+] -->
  <path d="M880,630 L740,630 L665,630" fill="none" stroke="#ff9f0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="740" y="585" width="230" height="85" rx="12" fill="#151722" stroke="#ff9f0a" stroke-width="1.5"/>
  <text x="755" y="615" fill="#ff9f0a" font-size="16" font-weight="bold">➕ НАЖАТИЕ ПЛЮСА</text>
  <text x="755" y="640" fill="#ffffff" font-size="13">Жмете вы после 2 тапов</text>
  <text x="755" y="658" fill="#8e8e93" font-size="11">Включает подмену ввода зрителя</text>

  <!-- Выноска 6: Кнопка [=] -->
  <path d="M880,735 L740,735 L665,718" fill="none" stroke="#ff9f0a" stroke-width="2" marker-end="url(#arrowOrange)"/>
  <rect x="740" y="690" width="230" height="85" rx="12" fill="#151722" stroke="#ff9f0a" stroke-width="1.5"/>
  <text x="755" y="720" fill="#ff9f0a" font-size="16" font-weight="bold">🏁 ЗНАК «РАВНО»</text>
  <text x="755" y="745" fill="#ffffff" font-size="13">Нажимает зритель в конце</text>
  <text x="755" y="763" fill="#8e8e93" font-size="11">Выводит итоговое число трюка</text>

  <!-- ================= НИЖНИЙ БЛОК: 3 ШАГА ВЫСТУПЛЕНИЯ ================= -->
  <rect x="30" y="890" width="940" height="270" rx="18" fill="#12131c" stroke="#222433" stroke-width="2"/>
  <text x="500" y="930" fill="#ffffff" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">ПОШАГОВЫЙ СЦЕНАРИЙ ФОКУСА ПЕРЕД ЗРИТЕЛЕМ</text>

  <!-- Шаг 1 -->
  <rect x="50" y="960" width="280" height="175" rx="12" fill="#181a26"/>
  <circle cx="80" cy="995" r="16" fill="#00e5ff"/>
  <text x="80" y="1001" fill="#000" font-size="16" font-weight="bold" text-anchor="middle">1</text>
  <text x="110" y="1001" fill="#00e5ff" font-size="16" font-weight="bold">ЧИСЛО ЗРИТЕЛЯ</text>
  <text x="70" y="1035" fill="#ffffff" font-size="13">Зритель берет телефон и</text>
  <text x="70" y="1055" fill="#ffffff" font-size="13">вводит любое 3–4 значное</text>
  <text x="70" y="1075" fill="#ffffff" font-size="13">число (год, день рождения).</text>
  <text x="70" y="1105" fill="#8e8e93" font-size="12">«Введи любое случайное число»</text>

  <!-- Шаг 2 -->
  <rect x="360" y="960" width="280" height="175" rx="12" fill="#181a26"/>
  <circle cx="390" cy="995" r="16" fill="#ff9f0a"/>
  <text x="390" y="1001" fill="#000" font-size="16" font-weight="bold" text-anchor="middle">2</text>
  <text x="420" y="1001" fill="#ff9f0a" font-size="16" font-weight="bold">ЗАРЯД И ХАОС</text>
  <text x="380" y="1035" fill="#ffffff" font-size="13">Берете телефон, незаметно</text>
  <text x="380" y="1055" fill="#ffffff" font-size="13"><tspan fill="#00e5ff">2 тапа в левый угол</tspan> + жмете <tspan fill="#ff9f0a">[+]</tspan>.</text>
  <text x="380" y="1075" fill="#ffffff" font-size="13">Зритель вслепую тыкает цифры.</text>
  <text x="380" y="1105" fill="#8e8e93" font-size="12">«Сделай полный хаос вслепую»</text>

  <!-- Шаг 3 -->
  <rect x="670" y="960" width="280" height="175" rx="12" fill="#181a26"/>
  <circle cx="700" cy="995" r="16" fill="#30d158"/>
  <text x="700" y="1001" fill="#000" font-size="16" font-weight="bold" text-anchor="middle">3</text>
  <text x="730" y="1001" fill="#30d158" font-size="16" font-weight="bold">КУЛЬМИНАЦИЯ</text>
  <text x="690" y="1035" fill="#ffffff" font-size="13">Зритель жмет <tspan fill="#ff9f0a">[=]</tspan>.</text>
  <text x="690" y="1055" fill="#ffffff" font-size="13">На экране появляется ваше</text>
  <text x="690" y="1075" fill="#ffffff" font-size="13">загаданное число из записки!</text>
  <text x="690" y="1105" fill="#30d158" font-size="12">«А теперь разверни бумажку...»</text>
</svg>
