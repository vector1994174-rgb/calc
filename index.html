<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <!-- PWA / Fullscreen метатеги для скрытия адресной строки -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Калькулятор">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <title>Калькулятор</title>
    
    <!-- Идеальная векторная иконка Apple Calculator (SVG data-uri) -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%231c1c1e'/%3E%3Ccircle cx='170' cy='170' r='55' fill='%23a5a5a5'/%3E%3Ccircle cx='342' cy='170' r='55' fill='%23ff9f0a'/%3E%3Ccircle cx='170' cy='342' r='55' fill='%23333333'/%3E%3Ccircle cx='342' cy='342' r='55' fill='%23ff9f0a'/%3E%3Cpath d='M322 170h40M342 150v40' stroke='%23fff' stroke-width='14' stroke-linecap='round'/%3E%3Cpath d='M322 342h40' stroke='%23fff' stroke-width='14' stroke-linecap='round'/%3E%3Ctext x='170' y='182' font-family='-apple-system,system-ui,sans-serif' font-size='42' font-weight='500' fill='%23000' text-anchor='middle'%3EAC%3C/text%3E%3Ctext x='170' y='355' font-family='-apple-system,system-ui,sans-serif' font-size='48' font-weight='400' fill='%23fff' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%231c1c1e'/%3E%3Ccircle cx='170' cy='170' r='55' fill='%23a5a5a5'/%3E%3Ccircle cx='342' cy='170' r='55' fill='%23ff9f0a'/%3E%3Ccircle cx='170' cy='342' r='55' fill='%23333333'/%3E%3Ccircle cx='342' cy='342' r='55' fill='%23ff9f0a'/%3E%3Cpath d='M322 170h40M342 150v40' stroke='%23fff' stroke-width='14' stroke-linecap='round'/%3E%3Cpath d='M322 342h40' stroke='%23fff' stroke-width='14' stroke-linecap='round'/%3E%3Ctext x='170' y='182' font-family='-apple-system,system-ui,sans-serif' font-size='42' font-weight='500' fill='%23000' text-anchor='middle'%3EAC%3C/text%3E%3Ctext x='170' y='355' font-family='-apple-system,system-ui,sans-serif' font-size='48' font-weight='400' fill='%23fff' text-anchor='middle'%3E7%3C/text%3E%3C/svg%3E">

    <style>
        :root { 
            --bg-color: #000000; 
            --btn-gray: #333333; 
            --btn-light: #a5a5a5; 
            --btn-orange: #ff9f0a; 
            --text-white: #ffffff; 
            --text-black: #000000; 
        }
        * { 
            -webkit-touch-callout: none; 
            -webkit-user-select: none; 
            user-select: none; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        html, body { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            background-color: var(--bg-color); 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif; 
            overflow: hidden; 
            touch-action: manipulation;
        }
        body { 
            display: flex; 
            flex-direction: column; 
            justify-content: flex-end; 
            padding-bottom: env(safe-area-inset-bottom, 24px); 
            padding-top: env(safe-area-inset-top, 20px);
        }
        
        /* Скрытые зоны жестов */
        #magic-trigger { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 25vw; 
            height: 12vh; 
            z-index: 9999; 
            background: transparent; 
        }
        #unlock-trigger { 
            position: absolute; 
            top: 0; 
            right: 0; 
            width: 25vw; 
            height: 12vh; 
            z-index: 9999; 
            background: transparent; 
        }

        /* Дисплей */
        .display-container { 
            flex-grow: 1; 
            display: flex; 
            justify-content: flex-end; 
            align-items: flex-end; 
            padding: 0 32px 14px 32px; 
            touch-action: pan-y;
        }
        #display { 
            color: var(--text-white); 
            font-size: 88px; 
            font-weight: 300; 
            letter-spacing: -1.5px;
            text-align: right; 
            width: 100%; 
            white-space: nowrap; 
            line-height: 1; 
            pointer-events: none; 
        }

        /* Клавиатура */
        .keypad { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            grid-gap: 14px; 
            padding: 10px 16px; 
            width: 100%; 
            max-width: 440px; 
            margin: 0 auto; 
        }
        .btn-wrapper { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 1/1; 
        }
        .wrapper-zero { 
            grid-column: span 2; 
            aspect-ratio: auto; 
            height: 100%; 
        }
        button { 
            border: none; 
            border-radius: 50%; 
            width: 100%; 
            height: 100%; 
            font-size: 38px; 
            font-weight: 400; 
            cursor: pointer; 
            outline: none; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 0; 
            margin: 0; 
            transition: filter 0.12s ease;
        }
        button:active, .active-touch { 
            filter: brightness(1.35); 
        }
        .btn-gray { 
            background-color: var(--btn-gray); 
            color: var(--text-white); 
        }
        .btn-light { 
            background-color: var(--btn-light); 
            color: var(--text-black); 
            font-weight: 400; 
            font-size: 34px;
        }
        .btn-orange { 
            background-color: var(--btn-orange); 
            color: var(--text-white); 
            font-weight: 500; 
            font-size: 42px; 
        }
        .btn-zero { 
            border-radius: 100px; 
            justify-content: flex-start; 
            padding-left: 32px; 
        }
        .operator-active { 
            background-color: #ffffff !important; 
            color: var(--btn-orange) !important; 
        }
        
        .text-fit-sm { font-size: 70px !important; }
        .text-fit-md { font-size: 54px !important; }
        .text-fit-xs { font-size: 40px !important; }
    </style>
</head>
<body>
    <div id="magic-trigger"></div>
    <div id="unlock-trigger"></div>
    
    <div class="display-container" id="disp-cont">
        <div id="display">0</div>
    </div>

    <div class="keypad">
        <div class="btn-wrapper"><button class="btn-light" id="btn-ac" data-a="AC">AC</button></div>
        <div class="btn-wrapper"><button class="btn-light" data-a="sign">+/-</button></div>
        <div class="btn-wrapper"><button class="btn-light" data-a="percent">%</button></div>
        <div class="btn-wrapper"><button class="btn-orange op" data-op="/">÷</button></div>

        <div class="btn-wrapper"><button class="btn-gray" data-n="7">7</button></div>
        <div class="btn-wrapper"><button class="btn-gray" data-n="8">8</button></div>
        <div class="btn-wrapper"><button class="btn-gray" data-n="9">9</button></div>
        <div class="btn-wrapper"><button class="btn-orange op" data-op="*">×</button></div>

        <div class="btn-wrapper"><button class="btn-gray" data-n="4">4</button></div>
        <div class="btn-wrapper"><button class="btn-gray" data-n="5">5</button></div>
        <div class="btn-wrapper"><button class="btn-gray" data-n="6">6</button></div>
        <div class="btn-wrapper"><button class="btn-orange op" data-op="-">−</button></div>

        <div class="btn-wrapper"><button class="btn-gray" data-n="1">1</button></div>
        <div class="btn-wrapper"><button class="btn-gray" data-n="2">2</button></div>
        <div class="btn-wrapper"><button class="btn-gray" data-n="3">3</button></div>
        <div class="btn-wrapper"><button class="btn-orange op" data-op="+">+</button></div>

        <div class="wrapper-zero"><button class="btn-gray btn-zero" data-n="0">0</button></div>
        <div class="btn-wrapper"><button class="btn-gray" data-n=".">,</button></div>
        <div class="btn-wrapper"><button class="btn-orange" data-a="=">=</button></div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(() => {});
        }

        let TARGET_NUMBER = parseFloat(localStorage.getItem('magic_force_target') || '17071755');

        let cur = '0', prev = null, op = null, reset = false;
        let ghost = false, seq = "", idx = 0;
        let magicTaps = 0, magicTimer = null;
        let unlockTaps = 0, unlockTimer = null;

        const disp = document.getElementById('display');
        const dispCont = document.getElementById('disp-cont');
        const btnAc = document.getElementById('btn-ac');
        const ops = document.querySelectorAll('.op');

        function haptic(ms = 8) {
            if (navigator.vibrate) navigator.vibrate(ms);
        }

        // Активация: левый угол (2 быстрых тапа)
        document.getElementById('magic-trigger').addEventListener('touchstart', (e) => {
            e.preventDefault();
            magicTaps++;
            clearTimeout(magicTimer);
            magicTimer = setTimeout(() => { magicTaps = 0; }, 350);
            if (magicTaps === 2) {
                magicTaps = 0;
                ghostOn();
                haptic(35);
            }
        }, { passive: false });

        // Сброс: правый угол (3 быстрых тапа)
        document.getElementById('unlock-trigger').addEventListener('touchstart', (e) => {
            e.preventDefault();
            unlockTaps++;
            clearTimeout(unlockTimer);
            unlockTimer = setTimeout(() => { unlockTaps = 0; }, 400);
            if (unlockTaps === 3) {
                unlockTaps = 0;
                ghost = false;
                seq = "";
                haptic([20, 50, 20]);
            }
        }, { passive: false });

        // Изменение секретного числа: удержание 2.5 сек на дисплее
        let pressTimer = null;
        dispCont.addEventListener('touchstart', () => {
            pressTimer = setTimeout(() => {
                let entered = prompt("Загаданное число для трюка:", TARGET_NUMBER);
                if (entered && !isNaN(parseFloat(entered))) {
                    TARGET_NUMBER = parseFloat(entered);
                    localStorage.setItem('magic_force_target', TARGET_NUMBER);
                    haptic(50);
                }
            }, 2500);
        });
        dispCont.addEventListener('touchend', () => clearTimeout(pressTimer));

        // Свайп влево/вправо для удаления цифры (как в iOS)
        let touchStartX = 0;
        dispCont.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });
        dispCont.addEventListener('touchend', (e) => {
            let diffX = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(diffX) > 40) {
                if (cur.length > 1) cur = cur.slice(0, -1);
                else cur = '0';
                upd();
            }
        }, { passive: true });

        document.querySelectorAll('button').forEach(btn => {
            const handlePress = (e) => {
                e.preventDefault();
                btn.classList.add('active-touch');
                setTimeout(() => btn.classList.remove('active-touch'), 120);
                haptic(6);

                const a = btn.dataset.a;
                const o = btn.dataset.op;
                const n = btn.dataset.n;

                if (a) action(a);
                else if (o) oper(o);
                else if (n !== undefined) num(n);
            };

            btn.addEventListener('touchstart', handlePress, { passive: false });
            btn.addEventListener('mousedown', (e) => {
                if (!('ontouchstart' in window)) handlePress(e);
            });
        });

        function ghostOn() {
            let c = parseFloat(cur) || 0;
            if (prev !== null && op !== null) {
                calc(true);
                c = parseFloat(cur) || 0;
            }
            let diff = TARGET_NUMBER - c;
            seq = String(Math.abs(Math.round(diff)));
            idx = 0;
            ghost = true;
        }

        function num(n) {
            btnAc.innerText = 'C';
            if (ghost) {
                if (reset) {
                    cur = '';
                    reset = false;
                    clearOp();
                }
                if (idx < seq.length) {
                    cur += seq[idx++];
                }
                upd();
                return;
            }

            if (cur === '0' && n !== '.') cur = '';
            if (reset) {
                cur = (n === '.') ? '0.' : n;
                reset = false;
                clearOp();
            } else {
                if (n === '.' && cur.includes('.')) return;
                cur += n;
            }
            upd();
        }

        function oper(o) {
            if (op !== null && !reset) calc(true);
            prev = cur;
            op = o;
            reset = true;
            highOp(o);
        }

        function calc(inter = false) {
            if (ghost && !inter) {
                cur = String(TARGET_NUMBER);
                op = null;
                prev = null;
                ghost = false;
                reset = true;
                clearOp();
                upd();
                return;
            }
            if (prev === null || op === null) return;
            const p = parseFloat(prev), c = parseFloat(cur);
            let r = 0;
            switch(op) {
                case '+': r = p + c; break;
                case '-': r = p - c; break;
                case '*': r = p * c; break;
                case '/': r = c !== 0 ? (p / c) : 'Ошибка'; break;
            }
            cur = String(typeof r === 'number' ? parseFloat(r.toFixed(8)) : r);
            if (!inter) { op = null; prev = null; }
            reset = true;
            clearOp();
            upd();
        }

        function action(a) {
            if (a === 'AC') {
                cur = '0';
                prev = null;
                op = null;
                reset = false;
                ghost = false;
                btnAc.innerText = 'AC';
                clearOp();
            } else if (a === 'sign') {
                if (cur !== '0' && cur !== '') {
                    cur = cur.startsWith('-') ? cur.substring(1) : '-' + cur;
                }
            } else if (a === 'percent') {
                cur = String(parseFloat(cur) / 100);
            } else if (a === '=') {
                calc();
            }
            upd();
        }

        function upd() {
            let v = cur.replace('.', ',');
            disp.className = '';
            if (v.length > 6 && v.length <= 8) disp.classList.add('text-fit-sm');
            else if (v.length > 8 && v.length <= 11) disp.classList.add('text-fit-md');
            else if (v.length > 11) disp.classList.add('text-fit-xs');

            let parts = v.split(',');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            disp.innerText = parts.join(',');
        }

        function highOp(o) {
            clearOp();
            ops.forEach(b => { if (b.dataset.op === o) b.classList.add('operator-active'); });
        }
        function clearOp() {
            ops.forEach(b => b.classList.remove('operator-active'));
        }
    </script>
</body>
</html>
